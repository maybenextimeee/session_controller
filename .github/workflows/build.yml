# Автосборка на сервере GitHub с Windows.
#
# При каждом пуше: тесты → SessionController.exe → проверка запуска →
# установщик и портативный архив. Их можно скачать на вкладке Actions,
# в разделе Artifacts нужного запуска.
#
# При пуше тега вида v0.4.0 дополнительно создаётся релиз на странице Releases:
# сверху текст из packaging/release-notes.md, в файлах — установщик.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -v

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/SessionController.spec

      - name: Smoke test (start the exe and quit)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $env:SESSION_CONTROLLER_HOME = "$env:RUNNER_TEMP\sc-smoke"
          $p = Start-Process -FilePath "dist\SessionController\SessionController.exe" `
            -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:SESSION_CONTROLLER_HOME\log.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed, exit code $($p.ExitCode)" }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import session_controller; print(session_controller.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          # Тег релиза должен совпадать с версией программы, иначе установщик
          # назовётся одной версией, а релиз — другой.
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match version $version in session_controller/__init__.py (expected v$version)"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = & $find
          }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test installer (install, run, uninstall)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Get-ChildItem dist\SessionController-Setup-*.exe | Select-Object -First 1
          $app = "$env:LOCALAPPDATA\Programs\Session Controller"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"

          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=autostart" -Wait
          if (-not (Test-Path "$app\SessionController.exe")) { throw "Program was not installed" }
          $autostart = (Get-ItemProperty $runKey -Name SessionController -ErrorAction Stop).SessionController
          Write-Host "Autostart: $autostart"
          if ($autostart -notlike "*--minimized") { throw "Unexpected autostart value" }

          $env:SESSION_CONTROLLER_HOME = "$env:RUNNER_TEMP\sc-installed"
          $p = Start-Process "$app\SessionController.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed exe failed, exit code $($p.ExitCode)" }

          # Деинсталлятор перезапускает себя из временной папки, поэтому ждём, пока исчезнет exe.
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\SessionController.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path "$app\SessionController.exe") { throw "Program was not uninstalled" }
          if (Get-ItemProperty $runKey -Name SessionController -ErrorAction SilentlyContinue) {
            throw "Autostart entry was not removed"
          }
          Write-Host "Install / run / uninstall OK"

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SessionController `
            -DestinationPath "dist\SessionController-${{ steps.version.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SessionController-${{ steps.version.outputs.version }}
          path: |
            dist/SessionController-Setup-*.exe
            dist/SessionController-*-portable.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Session Controller ${{ steps.version.outputs.version }}
          body_path: packaging/release-notes.md
          # Под текстом из body_path GitHub допишет список изменений.
          generate_release_notes: true
          # В релиз кладём только установщик: его и нужно скачивать.
          # Портативный архив остаётся в Artifacts на вкладке Actions.
          files: dist/SessionController-Setup-*.exe
          fail_on_unmatched_files: true
